name: AWS Boundary Operator CI

on:
  push:
    branches:
      - hackathon/aws-boundary-operator-2026
    paths:
      - "aws-boundary-operator/**"
      - ".github/workflows/aws-boundary-operator-ci.yml"
  pull_request:
    paths:
      - "aws-boundary-operator/**"
      - ".github/workflows/aws-boundary-operator-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws-boundary-operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: aws-boundary-operator/pyproject.toml
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit and SDK smoke tests
        run: python -m unittest discover -s tests -v
