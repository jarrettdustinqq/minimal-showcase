name: AWS Boundary Operator CI

on:
  push:
    branches:
      - hackathon/aws-boundary-operator-2026
    paths:
      - "aws-boundary-operator/**"
      - ".github/workflows/aws-boundary-operator-ci.yml"
  pull_request:
    paths:
      - "aws-boundary-operator/**"
      - ".github/workflows/aws-boundary-operator-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws-boundary-operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: aws-boundary-operator/pyproject.toml
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Unit and SDK smoke tests
        run: python -m unittest discover -s tests -v

  local-model-e2e:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aws-boundary-operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Boundary Operator with Ollama provider
        run: python -m pip install -e . 'strands-agents[ollama]>=1.44.0'
      - name: Start Ollama
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs ollama
          exit 1
      - name: Pull bounded tool-capable model
        run: docker exec ollama ollama pull qwen2.5:3b
      - name: Run real local-model evidence gate
        env:
          OLLAMA_MODEL: qwen2.5:3b
        run: python scripts/ollama_e2e.py
